# ~/.config/hypr/hyprland.conf

################
### MONITORS ###
################

monitor = eDP-1, 1920x1200@60, 0x0, 1

###################
### MY PROGRAMS ###
###################

$TERM = kitty
$TUIFILEMGR = kitty yazi
$DRUNMENU = wofi --show drun
$BROWSER = firefox
$ALTBROWSER = torbrowser-launcher
$NOTES = obsidian


#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = hypridle
exec-once = [workspace special:notes silent] $NOTES
exec-once = [workspace special:scratchpad silent] $TERM


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 1
    gaps_out = 1

    border_size = 5
    
    col.active_border = rgba(DD1919ee) rgba(DD6969ee) 35deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
# rounding
    rounding = 8
    rounding_power = 2

# opacity
    active_opacity = 1
    inactive_opacity = 0.985
	fullscreen_opacity = 1

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.17
    }
}

animations {
    enabled = true

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

$MOD = SUPER 


# run/kill

bind = $MOD, Q, exec, $TERM
bind = $MOD, E, exec, $BROWSER
bind = $MOD SHIFT, E, exec, $ALTBROWSER
bind = $MOD, D, exec, $DRUNMENU
bind = $MOD, W, exec, killall waybar || waybar

bind = $MOD, C, killactive, # kill active window
bind = $MOD, M, exit, # kill hyprland


# window manipulation

bind = $MOD, A, togglesplit, 
bind = $MOD, F, fullscreen,
bind = $MOD, V, togglefloating,
bind = $MOD, P, pseudo, # dwindle, maitain aspect ration of window i think idk


# screenshot tool

$SSPATH = ~/Pictures/Screenshots/
bind = $MOD, S, exec, grim -g "$(slurp)" - | wl-copy & wl-paste > $SSPATH"SelectSS"$(date +%Y.%m.%d_%H.%M.%S).png
bind = $MOD SHIFT, S, exec, grim - | wl-copy & wl-paste > $SSPATH"FullSS-"$(date +%Y.%m.%d_%H.%M.%S).png


# special workspace

bind = $MOD, X, togglespecialworkspace, scratchpad
bind = $MOD SHIFT, X,  movetoworkspace, special:scratchpad
bind = $MOD, SPACE, togglespecialworkspace, notes
bind = $MOD SHIFT, SPACE, movetoworkspace, special:notes


bind = $MOD, left, movefocus, l
bind = $MOD, right, movefocus, r
bind = $MOD, up, movefocus, u
bind = $MOD, down, movefocus, d

bind = $MOD SHIFT, left, movewindow, l
bind = $MOD SHIFT, right, movewindow, r
bind = $MOD SHIFT, up, movewindow, u
bind = $MOD SHIFT, down, movewindow, d

bind = $MOD, 1, workspace, 1
bind = $MOD, 2, workspace, 2
bind = $MOD, 3, workspace, 3
bind = $MOD, 4, workspace, 4
bind = $MOD, 5, workspace, 5
bind = $MOD, 6, workspace, 6
bind = $MOD, 7, workspace, 7
bind = $MOD, 8, workspace, 8
bind = $MOD, 9, workspace, 9
bind = $MOD, 0, workspace, 10

bind = $MOD SHIFT, 1, movetoworkspace, 1
bind = $MOD SHIFT, 2, movetoworkspace, 2
bind = $MOD SHIFT, 3, movetoworkspace, 3
bind = $MOD SHIFT, 4, movetoworkspace, 4
bind = $MOD SHIFT, 5, movetoworkspace, 5
bind = $MOD SHIFT, 6, movetoworkspace, 6
bind = $MOD SHIFT, 7, movetoworkspace, 7
bind = $MOD SHIFT, 8, movetoworkspace, 8
bind = $MOD SHIFT, 9, movetoworkspace, 9
bind = $MOD SHIFT, 0, movetoworkspace, 10

bind = $MOD, mouse_down, workspace, e+1
bind = $MOD, mouse_up, workspace, e-1

bindm = $MOD, mouse:272, movewindow
bindm = $MOD, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


###################
### WOFI CONFIG ###
###################

layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = ignorealpha 0.5, wofi
